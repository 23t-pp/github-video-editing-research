<script>
const film=document.querySelector('#film'),old=document.querySelector('#old'),seek=document.querySelector('#seek'),status=document.querySelector('#status'),position=document.querySelector('#position');let comparing=false;
function update(){const f=Math.min(1439,Math.max(0,Math.floor(film.currentTime*24+.001)));seek.value=f;status.textContent=`${film.currentTime.toFixed(3).padStart(6,'0')}秒 · F${f} / 1439`;if(document.activeElement!==position)position.value=film.currentTime.toFixed(3);if(comparing&&old.readyState>=1&&Math.abs(old.currentTime-film.currentTime)>.12)old.currentTime=film.currentTime;}
function setFrame(f){film.pause();old.pause();const t=Math.min(1439,Math.max(0,Math.round(f)))/24;film.currentTime=t;if(old.readyState>=1)old.currentTime=t;update();}
document.querySelector('#play').onclick=()=>{if(film.paused)film.play().catch(e=>document.querySelector('#note').textContent=e.message);else film.pause();};
document.querySelector('#prev').onclick=()=>setFrame(Math.round(film.currentTime*24)-1);document.querySelector('#next').onclick=()=>setFrame(Math.round(film.currentTime*24)+1);document.querySelector('#go').onclick=()=>setFrame(Number(position.value)*24);seek.oninput=()=>setFrame(Number(seek.value));document.querySelector('#rate').onchange=e=>{film.playbackRate=Number(e.target.value);old.playbackRate=film.playbackRate;};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>setFrame(Number(b.dataset.f)));
document.querySelector('#compare').onclick=e=>{comparing=!comparing;document.querySelector('#screens').classList.toggle('compare',comparing);e.target.textContent=comparing?'隐藏V1对照':'显示V1对照';e.target.setAttribute('aria-pressed',comparing);if(comparing){old.currentTime=film.currentTime;old.playbackRate=film.playbackRate;if(!film.paused)old.play().catch(()=>{});}else old.pause();};
film.addEventListener('timeupdate',update);film.addEventListener('seeked',update);film.addEventListener('play',()=>{if(comparing){old.currentTime=film.currentTime;old.play().catch(()=>{});}});film.addEventListener('pause',()=>old.pause());film.addEventListener('ended',()=>old.pause());film.addEventListener('error',()=>document.querySelector('#note').textContent='主片加载失败，请从本目录启动player-server.mjs再打开 http://127.0.0.1:5241。');
if(location.protocol.startsWith('http'))old.src='/V1.mp4';update();
</script></html>
